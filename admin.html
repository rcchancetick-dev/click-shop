<!DOCTYPE html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'><meta name='robots' content='noindex'><title>Admin – Click &amp; Shop</title><link href='https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap' rel='stylesheet'><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'></script>
<style>
:root{--bg:#fff;--surface:#f4f6fb;--ink:#0b1a3a;--muted:#55607a;--line:#dfe3ee;--or:#ff7a00;--on:#0b1a3a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--bg:#0a1126;--surface:#121c3b;--ink:#f1f3fa;--muted:#9ba6c0;--line:#243257;color-scheme:dark}}
:root[data-theme='dark']{--bg:#0a1126;--surface:#121c3b;--ink:#f1f3fa;--muted:#9ba6c0;--line:#243257;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Poppins,system-ui,sans-serif}
body::before{content:'';position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;padding-bottom:0}
.logo{font-weight:800;font-size:1.2rem}.logo i{font-style:normal;color:var(--or)}
h1{font-size:1.7rem;margin:26px 0 6px}h2{font-size:1.1rem;margin:0 0 12px}
.m{color:var(--muted);margin:0 0 14px}
.box{display:grid;gap:12px;background:var(--surface);border-radius:20px;padding:20px;margin:18px 0}
label{display:grid;gap:4px;font-weight:500;font-size:.9rem}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=file]{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;width:100%}
.chk{display:flex;align-items:center;gap:10px}
.b{border:0;border-radius:12px;background:var(--or);color:var(--on);font-weight:800;padding:13px 18px;cursor:pointer}
.b.g{background:none;border:2px solid var(--ink);color:var(--ink)}
.b:disabled{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.th{width:56px;height:56px;border-radius:12px;background:var(--surface);display:grid;place-items:center;font-size:1.8rem;object-fit:cover;overflow:hidden}
.item p{margin:0}
.item .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.sm{border:1.5px solid var(--line);background:none;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.off{opacity:.55}
</style></head>
<body>
<header><div class='wrap'><span class='logo'>Click <i>&amp;</i> Shop · Admin</span><button class='sm' id='out' hidden>Se déconnecter</button></div></header>
<main class='wrap'>
<section id='login' hidden><h1>Espace admin</h1><p class='m'>Connectez-vous pour publier et modifier vos produits.</p>
<div class='box'><label>E-mail<input id='em' type='email' autocomplete='email'></label><label>Mot de passe<input id='pw' type='password' autocomplete='current-password'></label><button class='b' id='in'>Se connecter</button><button class='b g' id='up'>Créer mon compte admin</button><p class='m' id='msg' role='status'></p></div></section>
<section id='app' hidden><h1>Vos produits</h1><p class='m'>Ajoutez un produit : il apparaît tout de suite sur la boutique.</p>
<form class='box' id='fm'><h2 id='ft'>Nouveau produit</h2>
<label>Nom du produit<input id='nm' type='text' required placeholder='Ex. Écouteurs Bluetooth'></label>
<div class='two'><label>Prix (Ar)<input id='pr' type='number' min='0' step='100' required inputmode='numeric'></label><label>Catégorie<input id='ct' type='text' list='cats' required placeholder='Ex. Tech'></label></div>
<datalist id='cats'></datalist>
<label>Photo du produit<input id='ph' type='file' accept='image/*'></label>
<label>Emoji (si pas de photo)<input id='ic' type='text' maxlength='4' placeholder='🛍️'></label>
<label class='chk'><input id='st' type='checkbox' checked> En stock</label>
<button class='b' id='sv'>Publier le produit</button><button class='b g' type='button' id='cl' hidden>Annuler la modification</button></form>
<div id='list'></div></section>
</main>
<script>
var U='https://sbiaevjiosnnrjhyarpz.supabase.co',K='sb_publishable_Rda2BKiVds7Gi2261UJ8UA_Eie72sNK';
var sb=supabase.createClient(U,K);
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>']/g,function(c){return '&#'+c.charCodeAt(0)+';'})};
var ed=null,rows=[];
function show(id){['login','app'].forEach(function(x){$('#'+x).hidden=x!==id});$('#out').hidden=id!=='app'}
function say(t){$('#msg').textContent=t}
async function gate(){var a=await sb.from('admins').select('email');
if(!a.data||!a.data.length){var r=await sb.rpc('claim_admin');if(!r.data){await sb.auth.signOut();show('login');say('Ce compte n’a pas accès à l’administration.');return}}
show('app');load()}
async function load(){var r=await sb.from('products').select('*').order('id',{ascending:false});rows=r.data||[];
$('#cats').innerHTML=rows.map(function(p){return p.category}).filter(function(c,i,a){return a.indexOf(c)===i}).map(function(c){return '<option value=\''+esc(c)+'\'>'}).join('');
$('#list').innerHTML=rows.length?rows.map(function(p){return '<div class=\'item'+(p.in_stock?'':' off')+'\'>'+(p.image_url?'<img class=th src=\''+esc(p.image_url)+'\' alt=\'\'>':'<div class=th>'+esc(p.emoji||'🛍️')+'</div>')+'<div><p><b>'+esc(p.name)+'</b></p><p class=m style=margin:0>'+Number(p.price).toLocaleString('fr-FR')+' Ar · '+esc(p.category)+(p.in_stock?'':' · Épuisé')+'</p></div><div class=acts><button class=sm data-ed='+p.id+'>Modifier</button><button class=sm data-st='+p.id+'>'+(p.in_stock?'Marquer épuisé':'Remettre en stock')+'</button><button class=sm data-del='+p.id+'>Supprimer</button></div></div>'}).join(''):'<p class=m>Aucun produit. Ajoutez le premier ci-dessus.</p>'}
function reset(){ed=null;$('#fm').reset();$('#ft').textContent='Nouveau produit';$('#sv').textContent='Publier le produit';$('#cl').hidden=true}
function shrink(file){return new Promise(function(res){var i=new Image();i.onload=function(){var s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.82)};i.src=URL.createObjectURL(file)})}
$('#in').onclick=async function(){var r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error)say('E-mail ou mot de passe incorrect.');else gate()};
$('#up').onclick=async function(){var r=await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value});if(r.error)say(r.error.message);else if(!r.data.session)say('Compte créé. Cliquez sur le lien reçu par e-mail, puis connectez-vous.');else gate()};
$('#out').onclick=async function(){await sb.auth.signOut();show('login')};
$('#cl').onclick=reset;
$('#fm').onsubmit=async function(e){e.preventDefault();var b=$('#sv');b.disabled=true;b.textContent='Publication…';
try{var url=ed?ed.image_url:null,fl=$('#ph').files[0];
if(fl){var blob=await shrink(fl),path=Date.now()+'.jpg',u=await sb.storage.from('products').upload(path,blob,{contentType:'image/jpeg'});if(u.error)throw u.error;url=sb.storage.from('products').getPublicUrl(path).data.publicUrl}
var row={name:$('#nm').value.trim(),category:$('#ct').value.trim(),price:Number($('#pr').value),emoji:$('#ic').value.trim()||'🛍️',image_url:url,in_stock:$('#st').checked};
var r=ed?await sb.from('products').update(row).eq('id',ed.id):await sb.from('products').insert(row);
if(r.error)throw r.error;reset();await load()}catch(x){alert('Erreur : '+x.message)}
b.disabled=false;b.textContent=ed?'Enregistrer':'Publier le produit'};
document.addEventListener('click',async function(e){var a=e.target.closest('[data-ed]'),s=e.target.closest('[data-st]'),d=e.target.closest('[data-del]');
if(a){ed=rows.find(function(p){return p.id==a.dataset.ed});$('#nm').value=ed.name;$('#pr').value=ed.price;$('#ct').value=ed.category;$('#ic').value=ed.emoji||'';$('#st').checked=ed.in_stock;$('#ft').textContent='Modifier le produit';$('#sv').textContent='Enregistrer';$('#cl').hidden=false;scrollTo({top:0,behavior:'smooth'})}
else if(s){var p=rows.find(function(x){return x.id==s.dataset.st});await sb.from('products').update({in_stock:!p.in_stock}).eq('id',p.id);load()}
else if(d&&confirm('Supprimer ce produit ?')){await sb.from('products').delete().eq('id',d.dataset.del);load()}});
sb.auth.getSession().then(function(r){r.data.session?gate():show('login')});
</script></body></html>
